<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NISS Blocks</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>NISS Blocks</h1>
    <p>Open-source website blocks with HTML, React and AI prompts.</p>
  </header>

  <input type="text" placeholder="Search blocks...">

  <div id="categories"></div>

  <div id="blocks-grid"></div>

  <div id="modal" class="hidden">
    <div class="modal-content">

      <div class="modal-header">
        <h2 id="modal-title"></h2>
        <button id="close-modal">×</button>
      </div>

      <div class="tabs">
        <button id="tab-html">HTML</button>
        <button id="tab-react">React</button>
        <button id="tab-prompt">AI Prompt</button>
      </div>

      <pre id="code-viewer"></pre>

      <div class="modal-footer">
        <button id="copy-btn">Copy</button>
      </div>

    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
