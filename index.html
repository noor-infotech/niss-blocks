<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NISS Blocks</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>NISS Blocks</h1>
    <p>Open-source website blocks with HTML, React and AI prompts.</p>
  </header>

  <input type="text" placeholder="Search blocks...">

  <div id="categories">
    <button>Hero</button>
    <button>Features</button>
    <button>Pricing</button>
    <button>FAQ</button>
    <button>CTA</button>
    <button>Footer</button>
  </div>

  <div id="blocks-grid">
  </div>

  <div id="modal" class="hidden">

  <div class="modal-content">

    <button id="close-modal">×</button>

    <h2 id="modal-title"></h2>

    <div class="tabs">
      <button id="tab-html">HTML</button>
      <button id="tab-react">React</button>
      <button id="tab-prompt">AI Prompt</button>
    </div>

    <pre id="code-viewer"></pre>

    <button id="copy-btn">
      Copy
    </button>

  </div>

  </div>

  <script src="script.js"></script>

</body>
</html>
